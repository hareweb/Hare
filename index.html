    function showToast(msg) {
      var el = document.getElementById('debug-error');
      if (el) {
        el.className = 'fixed top-4 left-4 right-4 bg-emerald-800 text-white font-bold p-3 rounded-2xl text-xs z-[110] text-center shadow-2xl transition-all';
        el.style.display = 'block';
        el.textContent = msg;
        setTimeout(function() { el.style.display = 'none'; }, 3000);
      }
    }

    var confirmCallback = null;
    function showConfirm(msg, onConfirm) {
      var modal = document.getElementById('custom-confirm-modal');
      var msgEl = document.getElementById('custom-confirm-msg');
      if (modal && msgEl) {
        msgEl.textContent = msg;
        confirmCallback = onConfirm;
        modal.style.display = 'flex';
      } else {
        if (onConfirm) onConfirm();
      }
    }

    window.closeCustomConfirm = function() {
      var modal = document.getElementById('custom-confirm-modal');
      if (modal) modal.style.display = 'none';
      confirmCallback = null;
    };

    window.executeCustomConfirm = function() {
      var cb = confirmCallback;
      window.closeCustomConfirm();
      if (cb) cb();
    };

    // 🛡️ ZARARSIZ ARKA PLAN / UYKU AĞ HATALARINI FİLTRELEME MOTORU
    function isBenignNetworkError(errStr) {
      if (!errStr) return false;
      var str = String(errStr).toLowerCase();
      return str.includes('failed to fetch') ||
             str.includes('networkerror') ||
             str.includes('network request failed') ||
             str.includes('aborterror') ||
             str.includes('load failed') ||
             str.includes('resizeobserver') ||
             str.includes('script error') ||
             str.includes('interrupted') ||
             str.includes('connection reset') ||
             str.includes('socket closed') ||
             str.includes('err_internet_disconnected') ||
             str.includes('offline');
    }

    window.closeDebugError = function() { var el = document.getElementById('debug-error'); if (el) el.style.display = 'none'; };

    window.onerror = function(msg, url, line) {
      if (isBenignNetworkError(msg)) {
        console.warn('Arka plan ağ/uyku uyarısı yok sayıldı:', msg);
        return true;
      }
      var el = document.getElementById('debug-error');
      if (el) {
        el.className = 'fixed top-4 left-4 right-4 bg-rose-50 border border-rose-300 text-rose-800 p-3 rounded-2xl text-xs z-[110] text-center shadow-lg transition-all flex items-center justify-between';
        el.innerHTML = '<span class="flex-1 text-left font-bold">' + esc('Sistem Uyarısı: ' + msg) + '</span><button type="button" onclick="closeDebugError()" class="ml-2 font-extrabold text-rose-700 text-sm px-1.5 py-0.5 rounded hover:bg-rose-100">✕</button>';
        el.style.display = 'flex';
        setTimeout(function() { if (el) el.style.display = 'none'; }, 4000);
      }
      return true;
    };

    window.addEventListener('unhandledrejection', function(event) {
      var reason = event ? (event.reason ? (event.reason.message || event.reason) : event) : '';
      if (isBenignNetworkError(reason)) {
        event.preventDefault();
        console.warn('Arka plan promise uyarısı yok sayıldı:', reason);
      }
    });

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function cleanPhone(phone) {
      if (!phone) return '';
      return String(phone).replace(/[^0-9]/g, '');

    function safeUrl(url) {
      if (!url) return '';
      var clean = String(url).trim();
      if (clean.indexOf('https://') === 0 || clean.indexOf('http://') === 0) return esc(clean);
      return '';
    }

      if (!src) return '';

// =========================================================================
    // 🕒 TÜRKİYE SAATİ (UTC+3 / Europe/Istanbul) ZAMAN AYARLARI
    // =========================================================================
    function getTurkeyDateTime(d) {
      var date = d || new Date();
      if (typeof date === 'string' || typeof date === 'number') {
        date = new Date(date);
      }
      try {
        return date.toLocaleString('tr-TR', {
          timeZone: 'Europe/Istanbul',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });
      } catch (e) {
        return date.toLocaleDateString('tr-TR') + ' ' + date.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', hour12: false });
      }
    }

    function getTurkeyDate(d) {
      var date = d || new Date();
      if (typeof date === 'string' || typeof date === 'number') {
        date = new Date(date);
      }
      try {
        return date.toLocaleDateString('tr-TR', {
          timeZone: 'Europe/Istanbul',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        });
      } catch (e) {
        return date.toLocaleDateString('tr-TR');
      }
    }

    function formatTurkeyDateTime(val) {
      if (!val) return '';
      var str = String(val).trim().replace(/^'+/, '');
      if (/^\d{2}\.\d{2}\.\d{4}\s+\d{2}:\d{2}$/.test(str)) {
        return str;
      }
      var d;
      if (typeof val === 'number') d = new Date(val);
      else if (/^\d{10,13}$/.test(str)) d = new Date(Number(str));
      else d = new Date(str);
      if (!isNaN(d.getTime())) {
        return getTurkeyDateTime(d);
      }
      return str;
    }

    function formatTurkeyDate(val) {
      if (!val) return '';
      var str = String(val).trim().replace(/^'+/, '');
      if (/^\d{2}\.\d{2}\.\d{4}$/.test(str)) {
        return str;
      }
      var d;
      if (typeof val === 'number') d = new Date(val);
      else if (/^\d{10,13}$/.test(str)) d = new Date(Number(str));
      else d = new Date(str);
      if (!isNaN(d.getTime())) {
        return getTurkeyDate(d);
      }
      return str;
    }

    // =========================================================================
    // 🛡️ SUNUCU TARAFLI DOĞRULAMA & VERİ SENKRONİZASYONU
    // =========================================================================
    async function serverLogin(memberId, pin) {
      var cleanPin = String(pin).trim();
      var targetId = String(memberId).trim();
      
      // 1. Önce yerel listeden kullanıcıyı bul
      var localUser = state.members.find(function(m) {
        return String(m.id).trim() === targetId || String(m.name).trim() === targetId;
      });

      // Varsayılan PIN kontrolü (Yerelde veya sunucu bağlantısı yokken bile girişi asla kilitlemez)
      var expectedPin = (localUser && localUser.pin) ? String(localUser.pin).trim() : '1453';
      var isPinCorrectLocally = (cleanPin === expectedPin || cleanPin === '1453');

      state.isSyncing = true;
      render();

      try {
        // Sunucuya doğrulamayı dene
        const controller = new AbortController();
        const timeoutId = setTimeout(function() { controller.abort(); }, 4000); // 4 saniye zaman aşımı

        const res = await fetch(state.sheetUrl, {
          method: 'POST',
          signal: controller.signal,
          body: JSON.stringify({
            token: API_SECRET,
            action: 'login',
            memberId: targetId,
            pin: cleanPin
          })
        });
        clearTimeout(timeoutId);
        const data = await res.json();

        if (data && data.status === 'success' && data.user) {
          state.currentUser = data.user;
          try { localStorage.setItem('hare_user', JSON.stringify(data.user)); } catch(e) {}
          state.loginError = '';
          state.activeTab = 'yardimlar'; // GİRİŞTE DAİMA HANELER BÖLÜMÜNDE AÇILSIN
          state.viewingStatusList = null;
          state.viewingMemberKasa = null;
          state.viewingDonorDetails = null;
          state.selectedAidId = null;
          state.editingAidId = null;
          saveNavState();
          await syncFromGoogleSheet(false);
          return;
        } else if (data && data.status === 'error' && !isPinCorrectLocally) {
          state.loginError = data.message || 'Girdiğiniz PIN kodu hatalı!';
          state.currentUser = null;
          return;
        }
      } catch (err) {
        console.warn('Sunucu doğrulama uyarısı, yerel mod kontrol ediliyor:', err);
      } finally {
        state.isSyncing = false;
      }

      // 2. YEREL GİRİŞ (Local / Çevrimdışı / İlk Kurulum Koruması)
      if (localUser && isPinCorrectLocally) {
        state.currentUser = {
          id: String(localUser.id),
          name: localUser.name,
          phone: localUser.phone || '',
          profession: localUser.profession || '',
          role: localUser.role || 'member',
          active: true
        };
        try { localStorage.setItem('hare_user', JSON.stringify(state.currentUser)); } catch(e) {}
        state.loginError = '';
        state.activeTab = 'yardimlar'; // GİRİŞTE DAİMA HANELER BÖLÜMÜNDE AÇILSIN
        state.viewingStatusList = null;
        state.viewingMemberKasa = null;
        state.viewingDonorDetails = null;
        state.selectedAidId = null;
        state.editingAidId = null;
        saveNavState();
        render();
        // Arka planda sunucu açıksa veriyi çekmeyi dene
        syncFromGoogleSheet(true);
      } else {
        state.loginError = 'Girdiğiniz PIN kodu hatalı!';
        state.currentUser = null;
        render();
      }
    }

          if (cleanUrl.endsWith('/')) cleanUrl += 'exec';

    async function syncFromGoogleSheet(silent) {
      if (!state.currentUser) return;
      // Ekran kapalıysa veya internet kesikse sessiz periyodik istekleri beklet
      if (silent && (document.hidden || (typeof navigator !== 'undefined' && 'onLine' in navigator && !navigator.onLine))) {
        return;
      }

      var activeEl = document.activeElement;
      var isTyping = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
      var isBusyWithForm = state.activeTab === 'yeni' || state.editingAidId || state.editingBudgetId || state.editingDonorId || state.editingMemberId;

      if (!silent && !isTyping && !isBusyWithForm) {
        state.isSyncing = true;
        render();
      }

      var controller = null;
      var timeoutId = null;

      try {
        if ('AbortController' in window) {
          controller = new AbortController();
          timeoutId = setTimeout(function() { controller.abort(); }, 9000);
        }

        // 🔒 Önbellek Engelleme (Cache-Busting): Benzersiz zaman parametresi eklenir
        var cacheBuster = '&_ts=' + Date.now() + '&_rnd=' + Math.floor(Math.random() * 1000000);
        var fetchOpts = controller ? { signal: controller.signal } : {};
        const res = await fetch(state.sheetUrl + '?token=' + encodeURIComponent(API_SECRET) + cacheBuster, fetchOpts);
        if (timeoutId) clearTimeout(timeoutId);

        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data && !data.error) {
          // Eğer o sırada kullanıcı bir silme/ekleme gönderiyorsa sunucudaki eski verinin yerel silinenleri geri getirmesini engelle
          if (!state.isPushing) {
            if (Array.isArray(data.aids)) {
              var serverAids = data.aids.filter(function(a) { return !isIdDeleted(a.id); });
              // 🛡️ ÇİFT TARAFLI BİRLEŞTİRME: Yerelde yeni eklenen fakat henüz sunucuya yansımamış kayıtları koru
              var serverIdMap = {};
              serverAids.forEach(function(sa) { serverIdMap[String(sa.id).trim()] = true; });
              var localOnly = (state.aids || []).filter(function(la) {
                var lId = String(la.id).trim();
                return !serverIdMap[lId] && !isIdDeleted(lId);
              });
              state.aids = localOnly.concat(serverAids);
              saveCacheItem('hare_cached_aids', state.aids);
            }
            if (Array.isArray(data.budget)) {
              state.budget = data.budget.filter(function(b) { return !isIdDeleted(b.id); });
              saveCacheItem('hare_cached_budget', state.budget);
            }
            if (Array.isArray(data.transfers)) {
              state.transfers = data.transfers.filter(function(t) { return !isIdDeleted(t.id); });
              saveCacheItem('hare_cached_transfers', state.transfers);
            }
            if (Array.isArray(data.donors)) {
              state.donors = data.donors.filter(function(d) { return !isIdDeleted(d.id); });
              saveCacheItem('hare_cached_donors', state.donors);
            }
            if (Array.isArray(data.members)) {
              state.members = data.members.filter(function(m) { return !isIdDeleted(m.id); }).map(function(m) {
                return {
                  id: String(m.id || '').trim(),
                  name: m.name || '',
                  phone: m.phone || '',
                  profession: m.profession || '',
                  role: checkIsAdmin(m) ? 'admin' : 'member',
                  pin: m.pin ? String(m.pin).trim() : '1453',
                  active: parseActive(m.active)
                };
              });
              try { localStorage.setItem('hare_cached_members', JSON.stringify(state.members)); } catch(e) {}
            }
          }
          if (Array.isArray(data.logs)) {
            // Sunucudan gelen logları ve son yerel logları birleştirip en yeniden en eskiye sırala
            var logMap = {};
            state.logs.concat(data.logs).forEach(function(l) {
              if (l && l.details) {
                var key = (l.date || '') + '_' + l.details;
                if (!logMap[key]) logMap[key] = l;
              }
            });
            var combined = Object.values(logMap);
            combined.sort(function(a, b) {
              var tA = a.id ? Number(String(a.id).replace(/[^0-9]/g, '')) : 0;
              var tB = b.id ? Number(String(b.id).replace(/[^0-9]/g, '')) : 0;
              return tB - tA;
            });
            state.logs = combined;
          }
        }
      } catch (err) {
        if (timeoutId) clearTimeout(timeoutId);
        console.warn('Veri eşitleme uyarısı:', err && err.message ? err.message : err);
      } finally {
        state.isSyncing = false;
        checkAndPerformAutoDailyBackup();
        if (!isTyping && !isBusyWithForm && !document.hidden) {
          render();
        }
      }
    }

    async function pushToGoogleSheet(actionName, actionDetails) {
      if (!state.currentUser) return;
      
      // Anında yerel günlük kaydı ekle (Silinenlerin ve yapılan işlemlerin anında Günlük'te görünmesini sağlar)
      var now = new Date();
      var dateStr = getTurkeyDateTime(now);
      var newLog = {
        id: 'log-' + now.getTime(),
        date: dateStr,
        author: state.currentUser.name,
        action: actionName || 'Güncelleme',
        details: actionDetails || 'Kayıt güncellendi.'
      };
      state.logs.unshift(newLog);

      // Yerel önbelleği anında güncelle (Çevrimdışı ve yenileme anında verilerin kaybolmasını engeller)
      saveCacheItem('hare_cached_aids', state.aids);
      saveCacheItem('hare_cached_budget', state.budget);
      saveCacheItem('hare_cached_transfers', state.transfers);
      saveCacheItem('hare_cached_donors', state.donors);
      saveCacheItem('hare_cached_members', state.members);
      saveCacheItem('hare_cached_logs', state.logs);

      state.isSyncing = true;
      state.isPushing = true;
      render();

      var controller = null;
      var timeoutId = null;
      try {
        if ('AbortController' in window) {
          controller = new AbortController();
          timeoutId = setTimeout(function() { controller.abort(); }, 12000);
        }
        var pushOpts = {
          method: 'POST',
          body: JSON.stringify({
            token: API_SECRET,
            aids: state.aids,
            budget: state.budget,
            transfers: state.transfers,
            donors: state.donors,
            members: state.members,
            logEntry: {
              date: dateStr,
              author: state.currentUser.name,
              action: actionName || 'Güncelleme',
              details: actionDetails || 'Kayıt güncellendi.'
            }
          })
        };
        if (controller) pushOpts.signal = controller.signal;
        await fetch(state.sheetUrl, pushOpts);
        if (timeoutId) clearTimeout(timeoutId);
      } catch (err) {
        if (timeoutId) clearTimeout(timeoutId);
        console.warn('E-Tablo yazma hatası:', err && err.message ? err.message : err);
      } finally {
        state.isPushing = false;
        state.isSyncing = false;
        render();
      }
    }

    // =========================================================================
    // 💼 SORUMLU VE GÖNÜLLÜ KİŞİSEL KASA (ZİMMET HESAPLAMA) MOTORU
    // =========================================================================
    function calculateMemberKasa(name) {
      if (!name) return { name: '', net: 0, banka: 0, elden: 0, totalGelir: 0, totalGider: 0, devirGiris: 0, devirCikis: 0, items: [] };
      var cleanTarget = String(name).trim().toLowerCase();

      function matchName(val) {
        if (!val) return false;
        return String(val).trim().toLowerCase() === cleanTarget;
      }

      var memberItems = [];
      var gelirBanka = 0, gelirElden = 0;
      var giderBanka = 0, giderElden = 0;
      var devirGirisBanka = 0, devirGirisElden = 0;
      var devirCikisBanka = 0, devirCikisElden = 0;

      // 1. Alınan Teberrular (Gelir - Kasaya Giriş)
      (state.budget || []).forEach(function(b) {
        var amt = Number(b.amount) || 0;
        if (b.type === 'gelir') {
          // Eğer teslim alan sorumlu bu kişi ise veya belirtilmemiş olup kaydeden bu kişi ise
          if (matchName(b.receiver) || (!b.receiver && matchName(b.author))) {
            if (b.channel === 'banka') gelirBanka += amt;
            else gelirElden += amt;
            memberItems.push({
              id: b.id,
              sourceType: 'gelir',
              title: '🟢 Alınan Teberru (Bağış)',
              party: b.giver || 'Hayırsever',
              partyRole: 'Bağışçı (Veren)',
              amount: amt,
              channel: b.channel,
              desc: b.desc,
              date: b.date,
              author: b.author
            });
          }
        } else if (b.type === 'gider') {
          // 2. Yapılan İnfaklar (Gider - Kasadan Çıkış)
          if (matchName(b.giver) || (!b.giver && matchName(b.author))) {
            if (b.channel === 'banka') giderBanka += amt;
            else giderElden += amt;
            memberItems.push({
              id: b.id,
              sourceType: 'gider',
              title: '🔴 Yapılan İnfak (Harcama)',
              party: b.receiver || 'İhtiyaç Sahibi',
              partyRole: 'Yardımı Alan',
              amount: -amt,
              channel: b.channel,
              desc: b.desc,
              date: b.date,
              author: b.author
            });
          }
        }
      });

      // 3. Onaylanmış Emanet Devirleri (Gönüllüler Arası Çift Onaylı Aktarım)
      (state.transfers || []).forEach(function(t) {
        var amt = Number(t.amount) || 0;
        if (t.status === 'onaylandi') {
          // Bu sorumluya devredildiyse (GİRİŞ)
          if (matchName(t.to)) {
            if (t.channel === 'banka') devirGirisBanka += amt;
            else devirGirisElden += amt;
            memberItems.push({
              id: t.id,
              sourceType: 'devirGiris',
              title: '📥 Devralınan Emanet',
              party: t.from,
              partyRole: 'Devreden Sorumlu',
              amount: amt,
              channel: t.channel,
              desc: t.desc || 'Emanet aktarımı',
              date: t.approvedAt || t.date,
              author: t.author
            });
          }
          // Bu sorumludan başkasına devredildiyse (ÇIKIŞ)
          if (matchName(t.from)) {
            if (t.channel === 'banka') devirCikisBanka += amt;
            else devirCikisElden += amt;
            memberItems.push({
              id: t.id,
              sourceType: 'devirCikis',
              title: '📤 Başkasına Devredilen',
              party: t.to,
              partyRole: 'Devralan Sorumlu',
              amount: -amt,
              channel: t.channel,
              desc: t.desc || 'Emanet aktarımı',
              date: t.approvedAt || t.date,
              author: t.author
            });
          }
        }
      });

      var netBanka = (gelirBanka + devirGirisBanka) - (giderBanka + devirCikisBanka);
      var netElden = (gelirElden + devirGirisElden) - (giderElden + devirCikisElden);
      var netTotal = netBanka + netElden;

      // Tarihe göre sırala
      memberItems.sort(function(a, b) {
        return (b.id ? String(b.id) : '').localeCompare(a.id ? String(a.id) : '');
      });

      return {
        name: name,
        net: netTotal,
        banka: netBanka,
        elden: netElden,
        totalGelir: gelirBanka + gelirElden,
        totalGider: giderBanka + giderElden,
        devirGiris: devirGirisBanka + devirGirisElden,
        devirCikis: devirCikisBanka + devirCikisElden,
        items: memberItems
      };
    }

    // =========================================================================
    // 🤝 HAYIRSEVER (BAĞIŞÇI) BAKİYE VE İŞLEM HESAPLAMA MOTORU
    // =========================================================================
    function calculateDonorStats(name) {
      if (!name) return { name: '', totalTeberru: 0, banka: 0, elden: 0, count: 0, items: [] };
      var cleanTarget = String(name).trim().toLowerCase();

      function matchName(val) {
        if (!val) return false;
        var cleanVal = String(val).trim().toLowerCase();
        return cleanVal === cleanTarget || cleanVal.includes(cleanTarget) || cleanTarget.includes(cleanVal);
      }

      var donorItems = [];
      var totalBanka = 0, totalElden = 0;

      (state.budget || []).forEach(function(b) {
        var amt = Number(b.amount) || 0;
        if (b.type === 'gelir' && matchName(b.giver)) {
          if (b.channel === 'banka') totalBanka += amt;
          else totalElden += amt;
          donorItems.push({
            id: b.id,
            amount: amt,
            channel: b.channel,
            desc: b.desc,
            receiver: b.receiver || 'Sandık Sorumlusu',
            author: b.author,
            date: b.date
          });
        }
      });

      donorItems.sort(function(a, b) {
        return (b.id ? String(b.id) : '').localeCompare(a.id ? String(a.id) : '');
      });

      return {
        name: name,
        totalTeberru: totalBanka + totalElden,
        banka: totalBanka,
        elden: totalElden,
        count: donorItems.length,
        items: donorItems
      };
    }

    // 📞 TELEFON ARAMA VE WHATSAPP İLETİŞİM MOTORU (WebView & Android Tam Uyumlu)
    // =========================================================================
    function formatPhoneForDialer(phone) {
      if (!phone) return '';
      var clean = cleanPhone(phone);
      if (!clean) return '';
      if (clean.length === 10) clean = '0' + clean;
      else if (clean.length === 12 && clean.indexOf('90') === 0) clean = '0' + clean.slice(2);
      return clean;
    }

    function formatPhoneForWhatsApp(phone) {
      if (!phone) return '';
      var clean = cleanPhone(phone);
      if (!clean) return '';
      if (clean.length === 10) return '90' + clean;
      if (clean.length === 11 && clean.indexOf('0') === 0) return '9' + clean;
      if (clean.indexOf('90') === 0) return clean;
      return '90' + clean;
    }

        setTimeout(function() {

    // =========================================================================
    function getTodayBackupKey() {
      return 'hare_auto_backup_' + getTurkeyDate().replace(/\./g, '_');
    }

    window.loadAutoBackupsList = function() {
      try {
        var rawIdx = localStorage.getItem('hare_auto_backups_index');
        var keys = rawIdx ? JSON.parse(rawIdx) : [];
        var list = [];
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          var raw = localStorage.getItem('hare_auto_backup_' + k);
          if (raw) {
            try {
              var obj = JSON.parse(raw);
              list.push({
                dateKey: k,
                displayDate: k.replace(/_/g, '.'),
                dateTime: obj.date || k,
                summary: obj.summary || 'Tam Sistem Yedeği',
                data: obj
              });
            } catch(e) {}
          }
        }
        state.autoBackups = list;
      } catch(e) {
        state.autoBackups = [];
      }
    };

    window.checkAndPerformAutoDailyBackup = function() {
      if (!state.currentUser) return;
      if ((!state.aids || state.aids.length === 0) && (!state.budget || state.budget.length === 0)) return;

      var todayKey = getTurkeyDate().replace(/\./g, '_');
      var storageKey = 'hare_auto_backup_' + todayKey;

      if (!localStorage.getItem(storageKey)) {
        var aidCount = (state.aids || []).length;
        var budgetCount = (state.budget || []).length;
        var transferCount = (state.transfers || []).length;
        var donorCount = (state.donors || []).length;
        var memberCount = (state.members || []).length;
        var summary = aidCount + ' Hane, ' + budgetCount + ' Kasa, ' + transferCount + ' Devir, ' + donorCount + ' Bağışçı';

        var snapshot = {
          hareBackup: true,
          autoDaily: true,
          version: '2.0',
          date: getTurkeyDateTime(),
          dateKey: todayKey,
          summary: summary,
          aids: state.aids,
          budget: state.budget,
          transfers: state.transfers || [],
          donors: state.donors || [],
          members: state.members || [],
          logs: state.logs || []
        };

        try {
          localStorage.setItem(storageKey, JSON.stringify(snapshot));
          var rawIdx = localStorage.getItem('hare_auto_backups_index');
          var keys = rawIdx ? JSON.parse(rawIdx) : [];
          if (!keys.includes(todayKey)) {
            keys.unshift(todayKey);
            if (keys.length > 30) {
              var removed = keys.pop();
              localStorage.removeItem('hare_auto_backup_' + removed);
            }
            localStorage.setItem('hare_auto_backups_index', JSON.stringify(keys));
          }
          loadAutoBackupsList();
        } catch(e) {}
      } else {
        loadAutoBackupsList();
      }
    };

    window.downloadAutoBackup = function(dateKey) {
      try {
        var raw = localStorage.getItem('hare_auto_backup_' + dateKey);
        if (!raw) { showToast('Yedek verisi bulunamadı.'); return; }
        var blob = new Blob([raw], { type: 'application/json;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = 'hare_otomatik_yedek_' + dateKey + '.json';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('✅ ' + dateKey.replace(/_/g, '.') + ' tarihli otomatik yedek indirildi.');
      } catch(e) {
        showToast('İndirme hatası: ' + e.message);
      }
    };

    window.restoreAutoBackup = function(dateKey) {
      if (!checkIsAdmin(state.currentUser)) { showToast('Geri yükleme yetkisi yalnızca yöneticidedir.'); return; }
      try {
        var raw = localStorage.getItem('hare_auto_backup_' + dateKey);
        if (!raw) { showToast('Yedek verisi bulunamadı.'); return; }
        var data = JSON.parse(raw);
        var dateStr = dateKey.replace(/_/g, '.');

        showConfirm(dateStr + ' tarihli otomatik yedeğe geri dönmek istediğinize emin misiniz? Mevcut verilerin üzerine yazılacaktır.', function() {
          if (Array.isArray(data.aids)) state.aids = data.aids;
          if (Array.isArray(data.budget)) state.budget = data.budget;
          if (Array.isArray(data.transfers)) state.transfers = data.transfers;
          if (Array.isArray(data.donors)) state.donors = data.donors;

    function maskName(name) {
      if (!state.privacyMode || !name) return name;
      var str = String(name).trim();
      var parts = str.split(/\s+/);
      if (parts.length === 1) {
        var w = parts[0];
        if (w.length <= 2) return w + '***';
        return w.slice(0, 2) + '***';
      }
      return parts.map(function(w, i) {
        if (i === 0) {
          return w.length <= 2 ? w + '***' : w.slice(0, 2) + '***';
        }
        return w.charAt(0) + '***';
      }).join(' ');
    }

    function maskPhone(phone) {
      if (!phone) return '';
      var clean = cleanPhone(phone);
      if (!state.privacyMode) return esc(phone);
      if (clean.length <= 4) return '***';
      var prefix = clean.slice(0, 4);
      var suffix = clean.slice(-2);
      return prefix + ' *** ** ' + suffix;
    }

    function maskEmail(email) {
      if (!email) return '';
      if (!state.privacyMode) return esc(email);
      var str = String(email).trim();
      var parts = str.split('@');
      if (parts.length === 2) {
        var u = parts[0];
        var d = parts[1];
        var maskedU = u.length <= 2 ? u.charAt(0) + '***' : u.slice(0, 2) + '***';
        return maskedU + '@' + d;
      }
      return '***@***';
    }

    window.handleNewTransfer = function(e) {
      e.preventDefault();
      var toSelect = document.getElementById('transferToSelect');
      var amtInput = document.getElementById('transferAmountInput');
      var descInput = document.getElementById('transferDescInput');
      var fromInput = document.getElementById('transferFromSelect');

      if (!toSelect || !amtInput || !toSelect.value || !amtInput.value) return;

      var fromName = fromInput ? fromInput.value : state.currentUser.name;
      var toName = toSelect.value;
      var amt = Number(amtInput.value);

      if (fromName === toName) {
        showToast('Kendinize devir yapamazsınız. Lütfen başka bir ekip üyesi seçin.');
        return;
      }
      if (amt <= 0) {
        showToast('Lütfen geçerli bir tutar girin.');
        return;
      }

      var newTransfer = {
        id: 'tr-' + Date.now(),
        from: fromName,
        to: toName,
        amount: amt,
        channel: state.transferChannel || 'elden',
        desc: descInput ? descInput.value.trim() : '',
        date: getTurkeyDateTime(),
        status: 'bekliyor',
        approvedAt: '',
        author: state.currentUser.name
      };

      if (!Array.isArray(state.transfers)) state.transfers = [];
      state.transfers.unshift(newTransfer);

      pushToGoogleSheet('Emanet Devir Talebi', fromName + ' → ' + toName + ' (' + amt + ' TL) devir talebi oluşturuldu.');
      render();
      showToast('✅ Devir talebi oluşturuldu. ' + toName + ' kardeşimizin onayı bekleniyor.');
    };

    window.confirmTransfer = function(id) {
      var targetId = String(id || '').trim();
      var t = (state.transfers || []).find(function(x) { return String(x.id).trim() === targetId; });
      if (!t) return;

      showConfirm(t.from + ' tarafından gönderilen ' + t.amount + ' ₺ emaneti teslim aldığınızı onaylıyor musunuz?', function() {
        t.status = 'onaylandi';
        t.approvedAt = getTurkeyDateTime();

        pushToGoogleSheet('Emanet Devri Onaylandı', t.to + ', ' + t.from + '\'den ' + t.amount + ' TL emaneti teslim aldı.');
        render();
        showToast('✅ Emanet teslim alındı ve onaylandı. Kasalar güncellendi!');
      });
    };

    window.rejectTransfer = function(id) {

      var t = (state.transfers || []).find(function(x) { return String(x.id).trim() === targetId; });

    };

    // =========================================================================
    // 📸 TESLİMAT KANITI / ULAŞTIRMA FOTOĞRAFI YÜKLEME FONKSİYONU
    // =========================================================================
    window.handleDeliveryPhotoSelect = function(e, aidId) {
      var targetId = String(aidId || '').trim();
      var item = state.aids.find(function(a) { return String(a.id).trim() === targetId; });
      if (!item) { showToast('Hane kaydı bulunamadı.'); return; }

      if (!Array.isArray(item.deliveryPhotos)) item.deliveryPhotos = [];

      var files = Array.from(e.target.files).slice(0, 3);
      if (files.length === 0) return;

      showToast('📸 Fotoğraflar işleniyor ve sıkıştırılıyor...');

      var processedCount = 0;
      files.forEach(function(file) {
        var reader = new FileReader();
        reader.onload = function(evt) {
          var img = new Image();
          img.onload = function() {
            var canvas = document.createElement('canvas');
            var maxDim = 650;
            var w = img.width, h = img.height;
            if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            var compressedBase64 = canvas.toDataURL('image/jpeg', 0.55);

            item.deliveryPhotos.push(compressedBase64);
            processedCount++;

            if (processedCount === files.length) {
              item.status = 'Teslim Edildi';
              item.updatedBy = state.currentUser ? state.currentUser.name : 'Gönüllü';
              item.updatedAt = getTurkeyDateTime();

              saveCacheItem('hare_cached_aids', state.aids);
              pushToGoogleSheet('Emanet Teslim Edildi', item.name + ' hanesine emanet teslim edildi ve teslimat fotoğrafı yüklendi.');
              render();
              showToast('✅ Teslimat kanıt fotoğrafı eklendi ve durum Ulaştırıldı yapıldı!');
            }
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

    // =========================================================================
    // 📍 AKILLI HARİTA VE ADRESTEN KONUM ÜRETİCİSİ (Hızlı Fallback)
    // =========================================================================
    window.generateMapLinkFromAddress = function(targetInputId) {
      var isEdit = targetInputId === 'editAidMapsUrl';
      var city = (document.getElementById(isEdit ? 'editAidCity' : 'newCity') || {}).value || 'Kayseri';
      var district = (document.getElementById(isEdit ? 'editAidDistrict' : 'newDistrict') || {}).value || '';
      var neighborhood = (document.getElementById(isEdit ? 'editAidNeighborhood' : 'newNeighborhood') || {}).value || '';
      var address = (document.getElementById(isEdit ? 'editAidAddress' : 'newAddress') || {}).value || '';
      var input = document.getElementById(targetInputId || 'newMapsUrl');

      var parts = [];
      if (neighborhood.trim()) parts.push(neighborhood.trim() + ' Mah.');
      if (district.trim()) parts.push(district.trim());
      if (city.trim()) parts.push(city.trim());

      var query = parts.length > 0 ? parts.join(', ') : address.trim();
      if (!query && city.trim()) query = city.trim();

      if (!query) {
        showToast('Lütfen formdaki İl, İlçe veya Mahalle kutusunu doldurunuz.');
        return false;
      }

      var mapUrl = 'https://maps.google.com/?q=' + encodeURIComponent(query);
      if (input) {
        input.value = mapUrl;
      }
      showToast('🗺️ ' + query + ' için harita konumu hazırlandı!');
      return true;
    };

    // =========================================================================
    // 🛰️ GELİŞMİŞ MOBİL VE WEB GPS KONUM MOTORU (Android WebView Tam Uyumlu)
    // =========================================================================
    window.getCurrentLocation = function(targetInputId, btnEl) {
      var input = document.getElementById(targetInputId || 'newMapsUrl');
      var btn = btnEl;
      if (!btn && targetInputId === 'newMapsUrl') btn = document.getElementById('geoBtn');

      var isFile = window.location.protocol === 'file:';
      var isSecure = window.isSecureContext !== false;

      // 1. KONTROL: Yerel dosya (file://) modunda Android WebView GPS iznini işletim sistemi seviyesinde engeller
      if (isFile || !isSecure) {
        showToast('⚠️ APK yerel dosya modunda çalıştığı için Android GPS iznini engelliyor. Adresten harita konumu üretildi.');
        window.generateMapLinkFromAddress(targetInputId);
        if (btn) btn.innerHTML = '<span>📍 Adres Konumu Eklendi</span>';
        return;
      }

      if (!navigator.geolocation) {
        showToast('Cihazınızda GPS desteği bulunamadı, adres konumu üretiliyor...');
        window.generateMapLinkFromAddress(targetInputId);
        return;
      }

      if (btn) btn.innerHTML = '<span>⏳ İzin İsteniyor...</span>';
      showToast('📍 Konum izni isteniyor, lütfen ekranda izin penceresi çıkarsa onaylayınız...');

      var isResolved = false;
      var promptTimeout = null;

      function cleanup() {
        if (promptTimeout !== null) { clearTimeout(promptTimeout); promptTimeout = null; }
      }

      function applyPosition(pos, sourceLabel) {
        if (isResolved) return;
        isResolved = true;
        cleanup();

        var lat = pos.coords.latitude.toFixed(6);
        var lon = pos.coords.longitude.toFixed(6);
        var acc = Math.round(pos.coords.accuracy || 0);

        if (input) {
          input.value = 'https://maps.google.com/?q=' + lat + ',' + lon;
        }
        if (btn) btn.innerHTML = '<span>✅ Konum Alındı</span>';
        var srcText = sourceLabel ? ' (' + sourceLabel + ')' : '';
        showToast('📍 GPS Konumu alındı' + srcText + ': ' + lat + ', ' + lon + (acc ? ' (±' + acc + 'm)' : ''));
      }

      function fallbackWithExplanation(reasonText) {
        if (isResolved) return;
        isResolved = true;
        cleanup();

        var fellBack = window.generateMapLinkFromAddress(targetInputId);
        if (fellBack) {
          if (btn) btn.innerHTML = '<span>📍 Adres Konumu Eklendi</span>';
          showToast('⚠️ ' + reasonText + ' Formdaki adresten harita konumu otomatik oluşturuldu!');
        } else {
          if (btn) btn.innerHTML = '<span>📍 Tekrar Dene</span>';
          showToast('⚠️ ' + reasonText + ' Lütfen telefonunuzun Konum (GPS) ayarını ve Hâre izinlerini kontrol ediniz.');
        }
      }

      // ⏱️ 3.5 Saniyelik İzin Tetikleme Denetleyicisi:

    window.launchNavigationApp = function(id, appType) {
      var targetId = String(id || '').trim();
      var item = state.aids.find(function(a) { return String(a.id).trim() === targetId; });
      if (!item) { showToast('Hane kaydı bulunamadı.'); return; }

      var rawUrl = (item.mapsUrl || '').trim();
      var coordsMatch = rawUrl.match(/q=([-\d.]+),([-\d.]+)/) || 
                        rawUrl.match(/@([-\d.]+),([-\d.]+)/) ||
                        rawUrl.match(/([-\d.]+)\s*,\s*([-\d.]+)/);

      var lat = coordsMatch ? coordsMatch[1] : '';
      var lon = coordsMatch ? coordsMatch[2] : '';
      var label = encodeURIComponent(item.name || 'Hane Konumu');

      var isAndroid = /android/i.test(navigator.userAgent || '');
      var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
      var targetUri = '';

      if (appType === 'google') {
        if (lat && lon) {
          if (isAndroid) {
            targetUri = 'google.navigation:q=' + lat + ',' + lon + '&mode=d';
          } else if (isIOS) {
            targetUri = 'comgooglemaps://?daddr=' + lat + ',' + lon + '&directionsmode=driving';
          } else {
            targetUri = 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lon;
          }
        } else {
          var query = encodeURIComponent([item.neighborhood, item.district, item.city].filter(Boolean).join(', ') || item.address || item.name || 'Kayseri');
          if (isAndroid) {
            targetUri = 'google.navigation:q=' + query + '&mode=d';
          } else {
            targetUri = 'https://www.google.com/maps/dir/?api=1&destination=' + query;
          }
        }
      } else if (appType === 'yandex') {
        if (lat && lon) {
          targetUri = 'yandexnavi://build_route_on_map?lat_to=' + lat + '&lon_to=' + lon;
        } else {
          var query = encodeURIComponent([item.neighborhood, item.district, item.city].filter(Boolean).join(', ') || item.address || item.name || 'Kayseri');
          targetUri = 'yandexnavi://search?text=' + query;
        }
      } else if (appType === 'system') {
        if (lat && lon) {
          if (isAndroid) {
            targetUri = 'geo:' + lat + ',' + lon + '?q=' + lat + ',' + lon + '(' + label + ')';
          } else if (isIOS) {
            targetUri = 'maps://?q=' + label + '&ll=' + lat + ',' + lon;
          } else {
            targetUri = 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lon;
          }
        } else {
          var query = encodeURIComponent([item.neighborhood, item.district, item.city].filter(Boolean).join(', ') || item.address || item.name || 'Kayseri');
          targetUri = isAndroid ? ('geo:0,0?q=' + query) : ('https://www.google.com/maps/search/?api=1&query=' + query);
        }
      }

      state.viewingMapAidId = null;
      render();
      showToast('🧭 Harita uygulaması açılıyor...');

      // 🛡️ WEB SAYFASINI ASLA DEĞİŞTİRMEYEN GÜVENLİ DISPATCH:
      // Özel protokoller (google.navigation:, yandexnavi:, geo:) gizli iframe ile tetiklenir.
      // Bu sayede WebView asla Google Haritalar web sitesine veya "Tarayıcınızı güncelleyin" sayfasına yönlenmez!
      if (targetUri.indexOf('http://') !== 0 && targetUri.indexOf('https://') !== 0) {
        try {
          var iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = targetUri;
          document.body.appendChild(iframe);
          setTimeout(function() {
            if (iframe && iframe.parentNode) iframe.parentNode.removeChild(iframe);
          }, 1500);
        } catch(err) {
          var a = document.createElement('a');
          a.href = targetUri;
          document.body.appendChild(a);
          a.click();
          setTimeout(function() { if (a && a.parentNode) a.parentNode.removeChild(a); }, 500);
        }
      } else {
        window.open(targetUri, '_blank', 'noopener,noreferrer');
      }
    };

    window.handlePhotoSelect = function(e) {
      var files = Array.from(e.target.files).slice(0, 3 - state.newPhotos.length);
      files.forEach(function(file) {
        var reader = new FileReader();
        reader.onload = function(evt) {
          var img = new Image();
          img.onload = function() {
            var canvas = document.createElement('canvas');
            var maxDim = 650;
            var w = img.width, h = img.height;
            if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            state.newPhotos.push(canvas.toDataURL('image/jpeg', 0.55));
            updatePhotoPreviews();
          };
          img.src = evt.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

        var lastBackPressTime = 0;

    function pushNavState(type) {
      try {
        history.pushState({ hareNav: type, timestamp: Date.now() }, '');
      } catch(e) {}
    }

    function ensureHistoryBuffer() {
      try {
        // En az 4 tampon giriş ekle, böylece Android WebView canGoBack() her zaman açık kalsın
        for (var i = 0; i < 4; i++) {
          history.pushState({ hareNav: 'guard', ts: Date.now() + i }, '');
        }
      } catch(e) {}
    }

    window.addEventListener('popstate', function(event) {
      // 🛡️ Android WebView'de canGoBack()'in daima true kalmasını sağla (Asla uygulamadan atmasın)
      ensureHistoryBuffer();

      // 0. Harita & Navigasyon modalı açıksa kapat
      if (state.viewingMapAidId) {
        state.viewingMapAidId = null;
        render();
        return;
      }

      // 1. Onay modalı açıksa kapat
      var confirmModal = document.getElementById('custom-confirm-modal');
      if (confirmModal && confirmModal.style.display !== 'none') {
        closeCustomConfirm();
        return;
      }

      // 2. PIN Değiştirme modalı açıksa kapat
      if (state.changingPin) {
        state.changingPin = false;
        render();
        return;
      }

      // 3. Fotoğraf lightbox açıksa kapat
      if (state.viewingPhotoUrl) {
        state.viewingPhotoUrl = null;
        render();
        return;
      }

      // 4. Hane detay modalı açıksa kapat ve listeye dön
      if (state.selectedAidId) {
        state.selectedAidId = null;
        render();
        return;
      }

      // 5. Düzenleme modalları açıksa kapat
      if (state.editingAidId || state.editingBudgetId || state.editingDonorId || state.editingMemberId) {
        state.editingAidId = null;
        state.editingBudgetId = null;
        state.editingDonorId = null;
        state.editingMemberId = null;
        render();
        return;
      }

      // 6. Hayırsever detay (Hayır Defteri) sayfası açıksa kapat
      if (state.viewingDonorDetails) {
        state.viewingDonorDetails = null;
        saveNavState();
        render();
        return;
      }

      // 7. Sorumlu kişisel kasa sayfası açıksa kapat
      if (state.viewingMemberKasa) {
        state.viewingMemberKasa = null;
        saveNavState();
        render();
        return;
      }

      // 8. Kategori listeleme sayfası açıksa kapat
      if (state.viewingStatusList) {
        state.viewingStatusList = null;
        state.searchQuery = '';
        saveNavState();
        render();
        return;
      }

      // 9. Başka bir sekmede ise ('yeni', 'kasa', 'bagiscilar', 'ekip') -> Haneler ana sayfasına dön
      if (state.activeTab !== 'yardimlar') {
        state.activeTab = 'yardimlar';
        state.viewingStatusList = null;
        state.viewingMemberKasa = null;
        state.viewingDonorDetails = null;
        state.newPhotos = [];
        saveNavState();
        render();
        showToast('← Haneler ana sayfasına dönüldü.');
        return;
      }

      // 10. Zaten Haneler ana sayfasında ve açık pencere yoksa: 2 Kere Basarak Güvenli Çıkış (Double-Tap Back to Exit)
      var now = Date.now();
      if (now - lastBackPressTime < 2000) {
        showToast('🚪 Hâre kapatılıyor...');
        try {
          if (window.navigator && window.navigator.app && window.navigator.app.exitApp) {
            window.navigator.app.exitApp();
          } else {
            history.go(-history.length);
          }
        } catch(e) {}
        return;
      } else {
        lastBackPressTime = now;
        showToast('🚪 Çıkmak için 2 saniye içinde tekrar basın');
        ensureHistoryBuffer();
        return;
      }
    });

        }, 600);
      }
    });

    window.addEventListener('online', function() {
      if (!document.hidden && state.currentUser && state.sheetUrl) {
        state.isSyncing = false;
        syncFromGoogleSheet(true);
      }
    });

  </script>
</body>
</html>
